<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CASIO fx-991EX ClassWiz scientific calculator">
  <meta name="theme-color" content="#17191a">
  
  <title>CASIO fx-991EX CLASSWIZ Calculator</title>
  
  <!-- Design Tokens (CSS Variables) -->
  <link rel="stylesheet" href="presentation/styles/tokens.css">
  
  <!-- Main Calculator Styles -->
  <link rel="stylesheet" href="presentation/styles/calculator.css">
  
  <!-- Animations -->
  <link rel="stylesheet" href="presentation/styles/animations.css">
  
  <!-- Optional: Responsive Styles -->
  <link rel="stylesheet" href="presentation/styles/responsive.css">
  <link rel="stylesheet" href="presentation/styles/calculator-skin.css">
</head>

<body data-theme="dark">
  
  <!-- Main Calculator Container -->
  <main class="calc-body" id="calculator">

    <header class="calculator-brand">
      <div class="brand-copy">
        <strong class="brand-logo">CASIO</strong>
        <span class="brand-model">fx-991EX</span>
        <span class="brand-series">CLASSWIZ</span>
      </div>
      <div class="solar-panel" aria-hidden="true"></div>
    </header>
    
    <!-- Theme Toggle (top-right) -->
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark/light theme" title="Toggle theme">
      🌙
    </button>
    
    <!-- Mode Indicator (top-left: small dot for SHIFT or ALPHA active) -->
    <div class="mode-indicator" id="modeIndicator"></div>
    
    <!-- LCD Display Area -->
    <section class="calc-display" id="display" role="region" aria-live="polite" aria-label="Calculator display">
      
      <!-- Display Indicators Row (DEG, RAD, GRAD, M, STO, etc.) -->
      <div class="display-indicators">
        <span class="indicator indicator-deg active" id="indicator-deg" data-mode="deg">DEG</span>
        <span class="indicator indicator-rad" id="indicator-rad" data-mode="rad">RAD</span>
        <span class="indicator indicator-grad" id="indicator-grad" data-mode="grad">GRAD</span>
        <span class="indicator indicator-m" id="indicator-m" data-memory="true">M</span>
        <span class="indicator indicator-base" id="baseNIndicator">DEC</span>
      </div>

      <div class="home-menu" aria-hidden="true">
        <span>× ÷<small>1</small></span>
        <span>▧<small>2</small></span>
        <span>²⁄₁₀<small>3</small></span>
        <span>▤<small>4</small></span>
        <span>↗<small>5</small></span>
        <span>▥<small>6</small></span>
        <span>∿<small>7</small></span>
        <span>▦<small>8</small></span>
      </div>
      
      <!-- Expression Line (top, smaller) -->
      <div class="display-expression" id="expressionLine" aria-label="Expression"></div>
      
      <!-- Result Line (bottom, larger) -->
      <div class="display-result" id="resultLine" aria-label="Result"></div>
      
    </section>

    <section class="mode-menu" id="modeMenu" aria-label="Calculation mode" hidden>
      <span class="mode-menu-title">Select mode</span>
      <button type="button" data-calculator-mode="calculate" aria-pressed="true">1&nbsp; Calculate</button>
      <button type="button" data-calculator-mode="base-n" aria-pressed="false">3&nbsp; Base-N</button>
    </section>
    
    <!-- Button Grid Container -->
    <section class="btn-grid" id="buttonGrid" role="region" aria-label="Calculator buttons">
      <div class="utility-keypad" role="group" aria-label="Calculator function keys">
      <!-- Navigation and mode keys -->
      <button class="btn btn-nav" data-key="shift" data-type="modifier" aria-label="SHIFT modifier">SHIFT</button>
      <button class="btn btn-nav" data-key="alpha" data-type="modifier" aria-label="ALPHA modifier">ALPHA</button>
      <button class="btn btn-nav" data-key="←" data-type="navigation" aria-label="Previous calculation">◀</button>
      <button class="btn btn-nav" data-key="→" data-type="navigation" aria-label="Next calculation">▶</button>
      <button class="btn btn-nav" data-key="↑" data-type="navigation" aria-label="Navigation up">↑</button>
      <button class="btn btn-nav" data-key="↓" data-type="navigation" aria-label="Navigation down">↓</button>
      <button class="btn btn-nav" data-key="menu" data-type="control" aria-label="Menu">MENU</button>
      <button class="btn btn-nav" data-key="opt" data-type="control" aria-label="Options">OPTN</button>
      <button class="btn btn-nav" data-key="calc" data-type="control" aria-label="Calculation mode">CALC</button>
      <button class="btn btn-nav" data-key="ON" data-type="control" aria-label="Power on and clear">ON</button>

      <!-- Scientific and editing keys -->
      <button class="btn btn-sci" data-key="∫" data-type="function" aria-label="Integral">∫</button>
      <button class="btn btn-sci" data-key="d/dx" data-type="function" aria-label="Derivative">d/dx</button>
      <button class="btn btn-sci" data-key="Σ" data-type="function" aria-label="Summation">Σ</button>
      <button class="btn btn-sci" data-key="x²" data-type="function" aria-label="Square">x²</button>
      <button class="btn btn-sci" data-key="√" data-type="function" aria-label="Square root">√</button>
      <button class="btn btn-sci" data-key="^" data-type="operator" aria-label="Power">xʸ</button>
      <button class="btn btn-sci" data-key="log" data-type="function" aria-label="Logarithm base 10">log</button>
      <button class="btn btn-sci" data-key="ln" data-type="function" aria-label="Natural logarithm">ln</button>
      <button class="btn btn-sci" data-key="π" data-type="function" aria-label="Pi">π</button>
      <button class="btn btn-sci" data-key="e" data-type="function" aria-label="Euler's number">e</button>
      <button class="btn btn-sci" data-key="!" data-type="function" aria-label="Factorial">x!</button>
      <button class="btn btn-sci" data-key="sin" data-type="function" aria-label="Sine">sin</button>
      <button class="btn btn-sci" data-key="cos" data-type="function" aria-label="Cosine">cos</button>
      <button class="btn btn-sci" data-key="tan" data-type="function" aria-label="Tangent">tan</button>
      <button class="btn btn-sci" data-key="(" data-type="operator" aria-label="Left parenthesis">(</button>
      <button class="btn btn-sci" data-key=")" data-type="operator" aria-label="Right parenthesis">)</button>
      <button class="btn btn-sci" data-key="STO" data-type="control" aria-label="Store or recall memory">STO</button>
      <button class="btn btn-sci" data-key="ENG" data-type="control" aria-label="Engineering notation">ENG</button>
      <button class="btn btn-sci" data-key="S⇔D" data-type="control" aria-label="Toggle decimal result">S⇔D</button>
      <button class="btn btn-memory" data-key="M+" data-type="memory" aria-label="Memory add">M+</button>
      </div>

      <div class="numeric-keypad" role="group" aria-label="Number and arithmetic keys">
      <!-- Row 5: Numbers 7-9 & Delete/Clear -->
      <button class="btn btn-number" data-key="7" data-type="number" aria-label="Seven">7</button>
      <button class="btn btn-number" data-key="8" data-type="number" aria-label="Eight">8</button>
      <button class="btn btn-number" data-key="9" data-type="number" aria-label="Nine">9</button>
      <button class="btn btn-delete" data-key="DEL" data-type="control" aria-label="Delete">DEL</button>
      <button class="btn btn-delete" data-key="AC" data-type="control" aria-label="All clear">AC</button>
      
      <!-- Row 6: Numbers 4-6 & Operators -->
      <button class="btn btn-number" data-key="4" data-type="number" aria-label="Four">4</button>
      <button class="btn btn-number" data-key="5" data-type="number" aria-label="Five">5</button>
      <button class="btn btn-number" data-key="6" data-type="number" aria-label="Six">6</button>
      <button class="btn btn-sci" data-key="×" data-type="operator" aria-label="Multiply">×</button>
      <button class="btn btn-sci" data-key="÷" data-type="operator" aria-label="Divide">÷</button>
      
      <!-- Row 7: Numbers 1-3 & Operators -->
      <button class="btn btn-number" data-key="1" data-type="number" aria-label="One">1</button>
      <button class="btn btn-number" data-key="2" data-type="number" aria-label="Two">2</button>
      <button class="btn btn-number" data-key="3" data-type="number" aria-label="Three">3</button>
      <button class="btn btn-sci" data-key="+" data-type="operator" aria-label="Add">+</button>
      <button class="btn btn-sci" data-key="−" data-type="operator" aria-label="Subtract">−</button>
      
      <!-- Row 8: Zero, Decimal, Special & Equals -->
      <button class="btn btn-number" data-key="0" data-type="number" aria-label="Zero">0</button>
      <button class="btn btn-number" data-key="." data-type="number" aria-label="Decimal point">.</button>
      <button class="btn btn-sci" data-key="×10ˣ" data-type="function" aria-label="Times ten to the power">×10ˣ</button>
      <button class="btn btn-sci" data-key="Ans" data-type="function" aria-label="Previous answer">Ans</button>
      <button class="btn btn-equals" data-key="=" data-type="equals" aria-label="Equals">=</button>
      </div>
    </section>

    <section class="base-n-panel" id="baseNPanel" aria-label="Base-N logical keypad" hidden>
      <div class="base-n-radices" role="group" aria-label="Number base">
        <button type="button" data-radix="10" class="is-active" aria-pressed="true">DEC</button>
        <button type="button" data-radix="16" aria-pressed="false">HEX</button>
        <button type="button" data-radix="2" aria-pressed="false">BIN</button>
        <button type="button" data-radix="8" aria-pressed="false">OCT</button>
      </div>
      <div class="base-n-logic" role="group" aria-label="Logical operators">
        <button type="button" class="btn" data-key="and" data-type="operator" aria-label="Bitwise AND">and</button>
        <button type="button" class="btn" data-key="or" data-type="operator" aria-label="Bitwise OR">or</button>
        <button type="button" class="btn" data-key="xor" data-type="operator" aria-label="Bitwise XOR">xor</button>
        <button type="button" class="btn" data-key="xnor" data-type="operator" aria-label="Bitwise XNOR">xnor</button>
        <button type="button" class="btn" data-key="not" data-type="function" aria-label="Bitwise NOT">Not</button>
        <button type="button" class="btn" data-key="neg" data-type="function" aria-label="Two's complement negation">Neg</button>
      </div>
      <div class="base-n-digits" role="group" aria-label="Hexadecimal digits">
        <button type="button" class="btn btn-number" data-key="A" data-type="number">A</button>
        <button type="button" class="btn btn-number" data-key="B" data-type="number">B</button>
        <button type="button" class="btn btn-number" data-key="C" data-type="number">C</button>
        <button type="button" class="btn btn-number" data-key="D" data-type="number">D</button>
        <button type="button" class="btn btn-number" data-key="E" data-type="number">E</button>
        <button type="button" class="btn btn-number" data-key="F" data-type="number">F</button>
      </div>
    </section>
    
  </main>
  
  <!-- Optional: History Panel (hidden by default, slides in from right) -->
  <aside class="history-panel" id="historyPanel" role="region" aria-label="Calculation history">
    <header>
      <h2>History</h2>
      <button class="history-close" id="historyClose" aria-label="Close history panel">✕</button>
    </header>
    <div class="history-list" id="historyList" role="log">
      <!-- Populated by JavaScript -->
    </div>
  </aside>
  
  <!-- Optional: Game Overlay (hidden by default, fades in) -->
  <div class="game-overlay" id="gameOverlay" role="dialog" aria-modal="true" aria-label="Guessing game">
    <div class="game-container" id="gameContainer">
      <!-- Populated by GameUI.js -->
    </div>
  </div>
  
  <!-- Core WASM Module (will be loaded by WasmService.js) -->
  <script>
    // Placeholder for Emscripten Module global
    var Module = {};
  </script>
  
  <!-- Application Scripts (in order) -->
  <script src="infrastructure/wasm-loader.js"></script>
  <script src="application/services/WasmService.js"></script>
  <script src="application/state/AppState.js"></script>
  <script src="application/services/StorageService.js"></script>
  <script src="application/services/LocalDataService.js"></script>
  <script src="src/presentation/components/Display.js"></script>
  <script src="src/presentation/components/ButtonGrid.js"></script>
  <script src="infrastructure/app-bootstrap.js"></script>
  
</body>
</html>
